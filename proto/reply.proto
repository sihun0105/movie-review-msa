syntax = "proto3";

import "common.proto";

package reply;

option go_package = "reply";

service ReplyService {
    rpc GetReply (GetReplyDto) returns (RepliesResult) {}
    rpc CreateReply (CreateReplyDto) returns (common.Empty) {}
    rpc UpdateReply (UpdateReplyDto) returns (common.Empty) {}
    rpc DeleteReply (DeleteReplyDto) returns (common.Empty) {}
    rpc ReactReply (ReactReplyDto) returns (ReplyReactionResult) {}
}

message Reply {
    int32 replyId = 1;
    int32 userId = 2;
    string nickname = 3;
    string email = 4;
    string comment = 5;
    string createdAt = 6;
    string updatedAt = 7;
    string avatar = 8;
    optional int32 parentId = 9;
    repeated Reply replies = 10;
    int32 likeCount = 11;
    int32 dislikeCount = 12;
    string userReaction = 13;
    bool isEdited = 14;
    bool isDeleted = 15;
}

message RepliesResult {
    repeated Reply replies = 1;
    bool hasNext = 2;
}

message GetReplyDto {
  int32 movieId = 2;
  int32 page = 3;
  optional int32 userId = 4;
}

message ReactReplyDto {
  int32 userId = 1;
  int32 commentId = 2;
  string reaction = 3;
}

message ReplyReactionResult {
  int32 likeCount = 1;
  int32 dislikeCount = 2;
  string reaction = 3;
}

message CreateReplyDto {
  int32 userId = 1;
  int32 movieId = 2;
  string comment = 3;
  optional int32 parentId = 4;
}

message UpdateReplyDto {
  int32 userId = 1;
  int32 commentId = 2;
  string comment = 3;
}

message DeleteReplyDto {
    int32 userId = 1;
    int32 commentId = 2;
}
