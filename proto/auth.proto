syntax = "proto3";

import "user.proto";

package auth;

option go_package = "auth";

service AuthService {
    rpc ValidateEmail (ValidateEmailDto) returns (ValidationResponse) {}
    rpc ValidateNickname (ValidateNicknameDto) returns (ValidationResponse) {}
    rpc SendVerificationCode (SendVerificationCodeDto) returns (CommonResponse) {}
    rpc VerifyCode (VerifyCodeDto) returns (ValidationResponse) {}
    rpc ForgotPassword (ForgotPasswordDto) returns (CommonResponse) {}
    rpc ValidateResetToken (ValidateResetTokenDto) returns (ValidationResponse) {}
    rpc ResetPassword (ResetPasswordDto) returns (CommonResponse) {}
    rpc LoginWithSession (LoginUserDto) returns (SessionLoginResponse) {}
    rpc OauthWithSession (GoogleIdTokenDto) returns (SessionLoginResponse) {}
    rpc ValidateSession (SessionTokenDto) returns (SessionValidationResponse) {}
    rpc RevokeSession (SessionTokenDto) returns (CommonResponse) {}
    rpc RevokeAllSessions (SessionTokenDto) returns (CommonResponse) {}
}

message GoogleIdTokenDto { string idToken = 1; }
message SessionTokenDto { string token = 1; }
message SessionLoginResponse {
    user.User user = 1;
    string token = 2;
}
message SessionValidationResponse {
    bool valid = 1;
    int32 userId = 2;
    string provider = 3;
}

message LoginUserDto {
    string email = 1;
    string password = 2;
}

message ValidateEmailDto {
    string email = 1;
}

message ValidateNicknameDto {
    string nickname = 1;
}

message ValidationResponse {
    bool isAvailable = 1;
    string message = 2;
}

message SendVerificationCodeDto {
    string email = 1;
}

message VerifyCodeDto {
    string email = 1;
    string code = 2;
}

message ForgotPasswordDto {
    string email = 1;
}

message ValidateResetTokenDto {
    string token = 1;
}

message ResetPasswordDto {
    string token = 1;
    string newPassword = 2;
}

message CommonResponse {
    bool success = 1;
    string message = 2;
}
